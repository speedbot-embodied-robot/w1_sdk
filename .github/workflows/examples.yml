name: Test runnable examples

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  python-cpp:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test standalone examples
        run: python3 scripts/test_examples.py

  ros2:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base
    timeout-minutes: 15
    env:
      ROS_LOCALHOST_ONLY: "1"
      ROS_DOMAIN_ID: "169"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ROS example build and test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3-colcon-common-extensions python3-pytest ros-humble-sensor-msgs ros-humble-std-srvs
      - name: Build and test the W1 reader against isolated endpoints
        working-directory: examples/ros2
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select w1_docs_ros2
          source install/local_setup.bash
          colcon test --packages-select w1_docs_ros2 --python-testing pytest --event-handlers console_direct+
          colcon test-result --verbose
          python3 test_cli.py
